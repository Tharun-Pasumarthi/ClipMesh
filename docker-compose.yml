services:
  postgres:
    image: postgres:17-alpine
    container_name: clipmesh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clipmesh
      POSTGRES_PASSWORD: clipmesh_secret
      POSTGRES_DB: clipmesh_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipmesh -d clipmesh_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clipmesh-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.server
    container_name: clipmesh-server
    restart: unless-stopped
    environment:
      CLIPMESH_HOST: "0.0.0.0"
      CLIPMESH_PORT: "8080"
      DATABASE_URL: "postgres://clipmesh:clipmesh_secret@postgres:5432/clipmesh_db"
      REDIS_URL: "redis://redis:6379/0"
      JWT_SECRET: "development-only-jwt-secret-key-32-chars-at-least"
      RUST_LOG: "info,clipmesh_server=debug"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

