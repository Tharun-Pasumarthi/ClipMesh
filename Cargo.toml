[workspace]
resolver = "2"
members = [
    "crates/clipmesh-crypto",
    "crates/clipmesh-identity",
    "crates/clipmesh-protocol",
    "crates/clipmesh-storage",
    "crates/clipmesh-sync",
    "crates/clipmesh-transfer",
    "crates/clipmesh-core",
    "apps/server",
    "apps/desktop/src-tauri",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ClipMesh Core Team"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Tharun-Pasumarthi/ClipMesh"

[workspace.dependencies]
tokio = { version = "1.42", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.11", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chacha20poly1305 = { version = "0.10", features = ["alloc"] }
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
x25519-dalek = { version = "2.0", features = ["static_secrets", "serde"] }
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tower = "0.5"
base64 = "0.22"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
parking_lot = "0.12"
async-trait = "0.1"
futures-util = "0.3"
